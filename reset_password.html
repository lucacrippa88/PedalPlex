<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password - PedalPlex</title>
  <link rel="icon" href="logos/pedalplex_logo_gradient.png" type="image/x-icon">
  <link rel="stylesheet" href="css/carbon-components.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/settings-menu.js" data-no-button></script>
</head>
<body>

<div class="auth-container" style="margin-top:80px; max-width: 400px; margin-left: auto; margin-right: auto; text-align: center;">
  <h2>Reset Password</h2>
  <br>

  <form id="resetForm" style="max-width: 400px; margin: auto;">
    <div style="position: relative; margin-bottom: 10px;">
      <input type="password" id="newPassword" placeholder="New Password" required class="bx--text-input" style="width: 100%;" />
      <button type="button" id="togglePasswordNew" aria-label="Show password" 
          style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer;">
          <svg xmlns="http://www.w3.org/2000/svg" class="bx--icon" width="20" height="20" fill="currentColor" viewBox="0 0 32 32">
          <path d="M16,10a6,6,0,1,1-6,6A6,6,0,0,1,16,10Zm0-2C10.5,8,5.8,12,4,16c1.8,4,6.5,8,12,8s10.2-4,12-8C26.2,12,21.5,8,16,8Z"/>
        </svg>
      </button>
    </div>

    <div style="position: relative; margin-bottom: 10px;">
      <input type="password" id="confirmPassword" placeholder="Confirm Password" required class="bx--text-input" style="width: 100%;" />
      <button type="button" id="togglePasswordConfirm" aria-label="Show password" 
          style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer;">
          <svg xmlns="http://www.w3.org/2000/svg" class="bx--icon" width="20" height="20" fill="currentColor" viewBox="0 0 32 32">
          <path d="M16,10a6,6,0,1,1-6,6A6,6,0,0,1,16,10Zm0-2C10.5,8,5.8,12,4,16c1.8,4,6.5,8,12,8s10.2-4,12-8C26.2,12,21.5,8,16,8Z"/>
        </svg>
      </button>
    </div>

    <br>
    <button type="submit" class="bx--btn bx--btn--primary" style="width: 100%;">
      <svg focusable="false" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" fill="currentColor" width="16" height="16" viewBox="0 0 32 32" aria-hidden="true" class="bx--btn__icon">
        <path d="M21,2a8.9977,8.9977,0,0,0-8.6119,11.6118L2,24v6H8L18.3881,19.6118A9,9,0,1,0,21,2Zm0,16a7.0125,7.0125,0,0,1-2.0322-.3022L17.821,17.35l-.8472.8472-3.1811,3.1812L12.4141,20,11,21.4141l1.3787,1.3786-1.5859,1.586L9.4141,23,8,24.4141l1.3787,1.3786L7.1716,28H4V24.8284l9.8023-9.8023.8472-.8474-.3473-1.1467A7,7,0,1,1,21,18Z"></path><circle cx="22" cy="10" r="2"></circle>
      </svg>
      Reset Password
    </button>
  </form>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
$(document).ready(function() {
  // Toggle password visibility
  const toggleNew = document.getElementById('togglePasswordNew');
  const toggleConfirm = document.getElementById('togglePasswordConfirm');
  const newInput = document.getElementById('newPassword');
  const confirmInput = document.getElementById('confirmPassword');

  if (toggleNew && newInput) {
    toggleNew.addEventListener('click', () => { newInput.type = newInput.type === 'password' ? 'text' : 'password'; });
  }
  if (toggleConfirm && confirmInput) {
    toggleConfirm.addEventListener('click', () => { confirmInput.type = confirmInput.type === 'password' ? 'text' : 'password'; });
  }

  // --- 1. Get token from query string ---
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");

  if (!token) {
    Swal.fire({
      title: "Error",
      text: "Token missing. Please use the link from your email.",
      icon: "error",
      confirmButtonText: "<svg focusable='false' preserveAspectRatio='xMidYMid meet' xmlns='http://www.w3.org/2000/svg' fill='currentColor' width='16' height='16' viewBox='0 0 32 32' aria-hidden='true' class='bx--btn__icon'><path d='M13 24 4 15 5.414 13.586 13 21.171 26.586 7.586 28 9 13 24z'></path></svg>Ok",
      customClass: { confirmButton: "bx--btn bx--btn--primary" },
      buttonsStyling: false
    }).then(() => window.location.href = "login");
    return;
  }

  // --- 2. Handle form submit ---
  $('#resetForm').on('submit', function(e) {
    e.preventDefault();

    const newPassword = $('#newPassword').val();
    const confirmPassword = $('#confirmPassword').val();

    if (newPassword !== confirmPassword) {
      Swal.fire({
        title: "Error",
        text: "Passwords do not match.",
        icon: "error",
        confirmButtonText: "<svg focusable='false' preserveAspectRatio='xMidYMid meet' xmlns='http://www.w3.org/2000/svg' fill='currentColor' width='16' height='16' viewBox='0 0 32 32' aria-hidden='true' class='bx--btn__icon'><path d='M13 24 4 15 5.414 13.586 13 21.171 26.586 7.586 28 9 13 24z'></path></svg>Ok",
        customClass: { confirmButton: "bx--btn bx--btn--primary" },
        buttonsStyling: false
      });
      return;
    }

    $.ajax({
      url: "https://api.pedalplex.com/USER_RESET_PASSWORD.php",
      method: "POST",
      contentType: "application/json",
      dataType: "json",
      data: JSON.stringify({
        token: token,
        new_password: newPassword
      }),
      success: function(res) {
        if (res.success) {
          Swal.fire({
            title: "Success",
            text: "Password updated! You can now log in.",
            icon: "success",
            confirmButtonText: "<svg focusable='false' preserveAspectRatio='xMidYMid meet' xmlns='http://www.w3.org/2000/svg' fill='currentColor' width='16' height='16' viewBox='0 0 32 32' aria-hidden='true' class='bx--btn__icon'><path d='M13 24 4 15 5.414 13.586 13 21.171 26.586 7.586 28 9 13 24z'></path></svg>Login",
            customClass: { confirmButton: "bx--btn bx--btn--primary" },
            buttonsStyling: false
          }).then(() => window.location.href = "login");
        } else if (res.expired) {
          Swal.fire({
            title: "Error",
            text: "The reset link has expired. Please request a new one.",
            icon: "error",
            confirmButtonText: "<svg focusable='false' preserveAspectRatio='xMidYMid meet' xmlns='http://www.w3.org/2000/svg' fill='currentColor' width='16' height='16' viewBox='0 0 32 32' aria-hidden='true' class='bx--btn__icon'><path d='M13 24 4 15 5.414 13.586 13 21.171 26.586 7.586 28 9 13 24z'></path></svg>Ok",
            customClass: { confirmButton: "bx--btn bx--btn--primary" },
            buttonsStyling: false
          }).then(() => window.location.href = "login");
        } else {
          Swal.fire({
            title: "Error",
            text: "Invalid token or user.",
            icon: "error",
            confirmButtonText: "<svg focusable='false' preserveAspectRatio='xMidYMid meet' xmlns='http://www.w3.org/2000/svg' fill='currentColor' width='16' height='16' viewBox='0 0 32 32' aria-hidden='true' class='bx--btn__icon'><path d='M13 24 4 15 5.414 13.586 13 21.171 26.586 7.586 28 9 13 24z'></path></svg>Ok",
            customClass: { confirmButton: "bx--btn bx--btn--primary" },
            buttonsStyling: false
          });
        }
      },
      error: function(xhr) {
        let msg = "Server error. Please try again.";
        try {
          const json = JSON.parse(xhr.responseText);
          if (json.error) msg = json.error;
        } catch {}
        Swal.fire({
          title: "Error",
          text: msg,
          icon: "error",
          confirmButtonText: "<svg focusable='false' preserveAspectRatio='xMidYMid meet' xmlns='http://www.w3.org/2000/svg' fill='currentColor' width='16' height='16' viewBox='0 0 32 32' aria-hidden='true' class='bx--btn__icon'><path d='M13 24 4 15 5.414 13.586 13 21.171 26.586 7.586 28 9 13 24z'></path></svg>Ok",
          customClass: { confirmButton: "bx--btn bx--btn--primary" },
          buttonsStyling: false
        });
      }
    });

  });
});
</script>

</body>
</html>
