<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PedalPlex – Admin: User Plexes</title>
  <link rel="icon" href="logos/pedalplex_logo_gradient.png" type="image/x-icon">
  <link rel="stylesheet" href="css/carbon-components.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <style>
    #admin-user-list {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 16px 80px;
    }
    #admin-user-list h2 {
      font-size: 1.25rem;
      margin-bottom: 16px;
    }
    .admin-user-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .admin-user-row:last-child { border-bottom: none; }
    .admin-user-info { flex: 1; min-width: 0; }
    .admin-user-id {
      font-weight: 600;
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .admin-user-meta {
      font-size: 0.75rem;
      opacity: 0.55;
      margin-top: 2px;
    }

    /* ---- Preview modal ---- */
    #admin-preview-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9000;
      background: rgba(0,0,0,0.7);
      overflow-y: auto;
    }
    #admin-preview-modal.active { display: flex; flex-direction: column; }
    #admin-preview-inner {
      position: relative;
      background: #161616;
      margin: 40px auto;
      width: 96vw;
      max-width: 1200px;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    #admin-preview-close {
      position: absolute;
      top: 12px;
      right: 16px;
      cursor: pointer;
      background: none;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      line-height: 1;
      padding: 4px 8px;
    }
    #admin-preview-header {
      margin-bottom: 16px;
    }
    #admin-preview-header h3 {
      font-size: 1.05rem;
      margin: 0 0 4px;
    }
    #admin-preview-header p {
      font-size: 0.8rem;
      opacity: 0.5;
      margin: 0;
    }
    #admin-plex-select-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    #admin-plex-select-wrap label {
      font-size: 0.85rem;
      opacity: 0.7;
    }
    #admin-plex-select {
      max-width: 360px;
    }
    /* Render area */
    #admin-preset-container {
      overflow-x: auto;
      min-height: 120px;
    }
    #admin-preset {
      /* mirror the #preset styles from plexes */
      transform-origin: top left;
    }
    /* reuse pedal-catalog pointer cursor reset */
    #admin-preset .pedal-catalog {
      cursor: default !important;
    }
  </style>
</head>
<body>

  <div class="bx--loading-overlay" id="pageLoader" style="display:none;">
    <div class="bx--loading" role="status">
      <svg class="bx--loading__svg" viewBox="-75 -75 150 150">
        <circle class="bx--loading__background" cx="0" cy="0" r="37.5"/>
        <circle class="bx--loading__stroke" cx="0" cy="0" r="37.5"/>
      </svg>
    </div>
  </div>

  <div id="page-content">
    <div id="admin-user-list">
      <h2>Admin – User Plexes</h2>
      <div id="admin-list-inner">
        <p style="opacity:0.5;">Loading users…</p>
      </div>
    </div>
  </div>

  <!-- Preview modal -->
  <div id="admin-preview-modal">
    <div id="admin-preview-inner">
      <button id="admin-preview-close" title="Close">✕</button>
      <div id="admin-preview-header">
        <h3 id="admin-preview-title">—</h3>
        <p id="admin-preview-subtitle">—</p>
      </div>
      <div id="admin-plex-select-wrap">
        <label for="admin-plex-select">Plex:</label>
        <select id="admin-plex-select" class="bx--select-input"></select>
      </div>
      <div id="admin-preset-container">
        <!-- #preset mirror: renderFullPedalboard writes here -->
        <div id="preset"></div>
      </div>
    </div>
  </div>

  <!-- Scripts – same stack as plexes.html minus editing scripts -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="labels.js"></script>
  <script src="helpers.js"></script>
  <script src="utils.js"></script>
  <script src="subplexes.js"></script>
  <script src="fullscreen-menu.js"></script>
  <script src="nav.js"></script>
  <script src="admin-plexes.js"></script>

  <script>
  $(document).ready(function () {
    const token = localStorage.getItem('authToken');
    if (!token) { window.location.href = '/login'; return; }

    $.ajax({
      url: 'https://api.pedalplex.com/USER_CHECK_AUTH_JWT.php',
      method: 'GET',
      dataType: 'json',
      headers: { 'Authorization': 'Bearer ' + token },
      success: function (user) {
        window.currentUser = user;
        if (user.role !== 'admin') {
          document.getElementById('admin-list-inner').innerHTML =
            '<p style="color:#ff5252;">Access denied – admin only.</p>';
          return;
        }
        initAdminPlexes(token);
      },
      error: function () {
        window.location.href = '/login';
      }
    });
  });
  </script>

</body>
</html>
