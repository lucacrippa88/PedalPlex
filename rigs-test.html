<!DOCTYPE html>

<head>

  <style>
    .pedal-catalog {
      outline: 2px dashed #666;
      outline-offset: 2px;
      position: relative;
    }
    .pedal-catalog::after {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image: repeating-linear-gradient(
        45deg,
        transparent, transparent 4px,
        rgba(0,0,0,0.2) 4px, rgba(0,0,0,0.2) 8px
      );
      z-index: 10;
      pointer-events: auto;
    }
    .pedal-catalog > * { pointer-events: none; }

    #pedalboard-controls {
      display: flex !important;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .dnd-placeholder {
      box-sizing: border-box;
      border: 2px dashed rgba(0,0,0,0.2);
      border-radius: 6px;
      margin: 0 6px;
      background: rgba(0,0,0,0.02);
      flex: 0 0 auto;
    }
    .dnd-ghost {
      position: fixed;
      pointer-events: none;
      z-index: 99999;
      transform: translate(-50%, -50%);
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      opacity: 0.95;
    }
    .pedal-wrapper, .pedal-catalog {
      transition: transform 180ms ease, box-shadow 120ms ease;
      will-change: transform;
    }
    .pedal-wrapper.dnd-dragging, .pedal-catalog.dnd-dragging {
      opacity: 0.85;
      box-shadow: 0 12px 30px rgba(0,0,0,0.45);
      transform-origin: center center;
    }
    .pedalboard-dnd-placeholder {
      box-sizing: border-box;
      border: 3px dashed rgba(50,50,200,0.7);
      border-radius: 8px;
      background: rgba(50,50,200,0.1);
      margin: 0 8px;
      flex: 0 0 auto;
      transition: height 100ms ease, width 100ms ease;
    }

    /* ── TEST banner ─────────────────────────────────── */
    #test-banner {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 9999;
      background: #462964;
      color: #fff;
      font-size: 0.75rem;
      text-align: center;
      padding: 4px 8px;
      letter-spacing: 0.05em;
      pointer-events: none;
    }

    /* ── Slot styles ─────────────────────────────────── */

    /* shared base */
    .rig-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 6px;
      transition: border-color 0.18s, background 0.18s;
      box-sizing: border-box;
      flex-shrink: 0;
    }
    .rig-slot:focus-visible { outline: 2px solid #9C54D5; outline-offset: 2px; }

    /*
      Pedal slot: matches "standard" size from helpers.js
        getPedalWidth('standard')  = 190px
        getPedalHeight('standard') = 160px
    */
    .rig-pedal-slot {
      width: 190px;
      height: 160px;
      border: 2px dashed #3a3a3a;
      background: transparent;
    }
    .rig-pedal-slot:hover { border-color: #9C54D5; background: #1a1a1a; }

    /*
      Amp slot: matches a "head" amp from helpers.js
        getPedalWidth('xlarge')   = 400px
        getPedalHeight('standard') = 160px
    */
    .rig-amp-slot {
      width: 400px;
      height: 160px;
      border: 1px solid #3a3a3a;
      background: #1e1e1e;
      border-radius: 8px;
    }
    .rig-amp-slot:hover { border-color: #9C54D5; background: #262626; }

    .rig-slot-plus {
      font-size: 1.5rem;
      font-weight: 300;
      color: #666;
      line-height: 1;
      margin-bottom: 6px;
      transition: color 0.18s;
    }
    .rig-slot:hover .rig-slot-plus { color: #9C54D5; }

    /* circled + for amp */
    .rig-amp-slot .rig-slot-plus {
      display: flex; align-items: center; justify-content: center;
      width: 2.2rem; height: 2.2rem;
      border-radius: 50%;
      border: 1.5px solid #666;
      font-size: 1.1rem;
    }
    .rig-amp-slot:hover .rig-slot-plus { border-color: #9C54D5; }

    .rig-slot-label {
      font-size: 0.8rem;
      color: #888;
      text-align: center;
    }
    .rig-amp-slot .rig-slot-label {
      font-size: 0.875rem;
      color: #bbb;
      font-weight: 500;
    }
    .rig-slot-sublabel {
      font-size: 0.7rem;
      color: #555;
      margin-top: 3px;
      text-align: center;
    }

    /* section label */
    .rig-section-label {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #666;
      text-transform: uppercase;
      margin: 0 0 8px 0;
    }

    /* Row 1: pedal slots side by side */
    .rig-pedal-row {
      display: flex;
      flex-wrap: nowrap;
      gap: 10px;
      align-items: center;
    }

    /* Row 2: amp slot — its own row, separated */
    .rig-amp-row {
      display: flex;
      align-items: center;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #2a2a2a;
    }
  </style>

    <!-- ═══════════════════════════════════════════════════════════════════
         TEST PATCH — overrides renderPedalboard() to add visible slots.
         Uses nav-rigs.js internals via the existing addGearsTrigger path.
         Does NOT modify any production file.
    ════════════════════════════════════════════════════════════════════ -->
    <script>
    (function () {

      const AMP_CATEGORIES = 'head/amp simulator/combo/preamp/power amp/cab simulator/frfr/ir loader';

      /* ── openSlot: uses nav-rigs.js machinery directly ─────────────── */
      // #toggleFilterBtn is the actual handler that shows the input and opens the
      // dropdown — it's showBoth so it works on all viewports via jQuery trigger.
      // Its handler: if dropdown has children → reshow them; else fetchAndRenderPedals.
      // So we always clear the dropdown first to force a fresh fetch.
      function openSlot(category) {
        const $input    = $('#pedalFilterInput');
        const $toggle   = $('#toggleFilterBtn');
        const $dropdown = $('#pedalAddDropdownContainer');

        // Clear any cached results so toggleFilterBtn always fires a fresh fetch
        $dropdown.empty().hide();

        // Pre-fill input with category (or blank for normal search)
        $input.val(category || '');

        // Trigger the toggle: it will show the input and call fetchAndRenderPedals
        $toggle.trigger('click');
      }

      /* ── makeSlot: builds a single placeholder card ─────────────────── */
      function makeSlot(category, isAmp) {
        const slot = document.createElement('div');
        slot.className = 'rig-slot ' + (isAmp ? 'rig-amp-slot' : 'rig-pedal-slot');
        slot.setAttribute('role', 'button');
        slot.setAttribute('tabindex', '0');
        slot.setAttribute('aria-label', isAmp ? 'Add an amplifier' : 'Add a pedal');

        slot.innerHTML = isAmp
          ? `<span class="rig-slot-plus">&#43;</span>
             <span class="rig-slot-label">Add an amplifier</span>
             <span class="rig-slot-sublabel">Choose your amp or cabinet</span>`
          : `<span class="rig-slot-plus">+</span>
             <span class="rig-slot-label">Add pedal</span>`;

        slot.addEventListener('click', () => openSlot(category));
        slot.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openSlot(category); }
        });
        return slot;
      }

      /* ── renderPedalboard override ───────────────────────────────────── */
      // Poll until rigs.js has registered the function, then replace it.
      const _poll = setInterval(() => {
        if (typeof window.renderPedalboard !== 'function') return;
        clearInterval(_poll);

        const _orig = window.renderPedalboard;

        window.renderPedalboard = function () {
          const hasPedals = window.pedalboard?.pedals?.length > 0;

          if (hasPedals) {
            // Let the original draw all real pedals first
            _orig();

            const container = document.getElementById('pedalboard');
            if (!container) return;

            // Add one "+ Add pedal" slot at the end of every pedal row
            // Real rows are direct flex children set via inline style
            Array.from(container.children).forEach(child => {
              if (child.style && child.style.display === 'flex') {
                if (!child.querySelector('.rig-pedal-slot')) {
                  child.style.alignItems = 'center';
                  child.appendChild(makeSlot('', false));
                }
              }
            });

            // Amp row — recreate every render so it's always fresh
            container.querySelector('.rig-amp-row')?.remove();
            const ampRow = document.createElement('div');
            ampRow.className = 'rig-amp-row';
            ampRow.appendChild(makeSlot(AMP_CATEGORIES, true));
            container.appendChild(ampRow);

            return;
          }

          /* ── Empty board: Row 1 = 2 pedal slots, Row 2 = 1 amp slot ── */
          const container = document.getElementById('pedalboard');
          if (!container) return;
          container.innerHTML = '';

          // Row 1 — 2 pedal slots
          const r1 = document.createElement('div');
          r1.className = 'rig-pedal-row';
          r1.appendChild(makeSlot('', false));
          r1.appendChild(makeSlot('', false));
          container.appendChild(r1);

          // Row 2 — 1 amp slot (wider, own row with divider)
          const ampRow = document.createElement('div');
          ampRow.className = 'rig-amp-row';
          ampRow.appendChild(makeSlot(AMP_CATEGORIES, true));
          container.appendChild(ampRow);
        };

      }, 50);

    })();
    </script>

  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const pending = JSON.parse(localStorage.getItem('pendingPedalAdd'));
    if (!pending) return;
    localStorage.removeItem('pendingPedalAdd');
    if (window.pedalboard && window.pedalboard.pedals) {
      window.pedalboard.pedals.push(pending);
      renderPedalboard();
    }
  });
  </script>

  <script>
  $(document).ready(function() {
    if (window.location.protocol === 'file:') {
      alert('Please run this app via a local HTTP server for full functionality.');
      $('#page-content').hide();
      return;
    }

    const token = localStorage.getItem('authToken');

    if (!token) {
      $('#page-content').show();
      $('#pedalboard-controls').prepend('<p>Login to consistently save your Rigs!</p>');
      $('#pedalboardSelect, #renameBoardBtn').hide();
      $('#zoomIn, #zoomOut, #zoomReset').prop('disabled', true).addClass('btn-disabled');
      window.currentUser = { role: 'guest', username: 'guest' };
      if (typeof initNavPedalboard === 'function') initNavPedalboard('guest');
      if (typeof initPedalboard    === 'function') initPedalboard('guest');
      return;
    }

    $.ajax({
      url: 'https://api.pedalplex.com/USER_CHECK_AUTH_JWT.php',
      method: 'GET', dataType: 'json',
      headers: { 'Authorization': 'Bearer ' + token },
      success: function(userFromServer) {
        $('#page-content').show();
        window.currentUser = userFromServer;
        if (typeof initNavPedalboard === 'function') initNavPedalboard(userFromServer.role);
        if (typeof initPedalboard    === 'function') initPedalboard(userFromServer.role);
      },
      error: function(xhr) {
        if (xhr.status === 401) {
          localStorage.removeItem('authToken');
          window.currentUser = { role: 'guest', username: 'guest' };
          $('#page-content').show();
          $('#pedalboardSelect, #renameBoardBtn').hide();
          if (typeof initNavPedalboard === 'function') initNavPedalboard('guest');
          if (typeof initPedalboard    === 'function') initPedalboard('guest');
        } else {
          alert('Auth check failed. Please try again.');
        }
      }
    });
  });
  </script>
