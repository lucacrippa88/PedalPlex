    /* ── existing rig styles (unchanged from production) ── */
    .pedal-catalog {
      outline: 2px dashed #666;
      outline-offset: 2px;
      position: relative;
    }
    .pedal-catalog::after {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: repeating-linear-gradient(
        45deg, transparent, transparent 4px,
        rgba(0,0,0,0.2) 4px, rgba(0,0,0,0.2) 8px
      );
      z-index: 10;
      pointer-events: auto;
    }
    .pedal-catalog > * { pointer-events: none; }
    #pedalboard-controls {
      display: flex !important;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }
    .dnd-placeholder {
      box-sizing: border-box;
      border: 2px dashed rgba(0,0,0,0.2);
      border-radius: 6px;
      margin: 0 6px;
      background: rgba(0,0,0,0.02);
      flex: 0 0 auto;
    }
    .dnd-ghost {
      position: fixed;
      pointer-events: none;
      z-index: 99999;
      transform: translate(-50%, -50%);
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      opacity: 0.95;
    }
    .pedal-wrapper, .pedal-catalog {
      transition: transform 180ms ease, box-shadow 120ms ease;
      will-change: transform;
    }
    .pedal-wrapper.dnd-dragging, .pedal-catalog.dnd-dragging {
      opacity: 0.85;
      box-shadow: 0 12px 30px rgba(0,0,0,0.45);
      transform-origin: center center;
    }
    .pedalboard-dnd-placeholder {
      box-sizing: border-box;
      border: 3px dashed rgba(50,50,200,0.7);
      border-radius: 8px;
      background: rgba(50,50,200,0.1);
      margin: 0 8px;
      flex: 0 0 auto;
      transition: height 100ms ease, width 100ms ease;
    }

    /* ── TEST banner ── */
    #test-banner {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 9999;
      background: #462964;
      color: #fff;
      font-size: 0.75rem;
      text-align: center;
      padding: 4px 8px;
      letter-spacing: 0.05em;
      pointer-events: none;
    }

    /* ── Empty-state slot cards ──────────────────────────────────────────
       Dimensions mirror helpers.js values used in renderPedal():
         getPedalWidth('standard')  = 190px  → pedal slot width
         getPedalHeight('standard') = 160px  → both slot heights
         getPedalWidth('xlarge')    = 400px  → amp slot width
    ─────────────────────────────────────────────────────────────────── */
    .rig-empty-state {
      /* same flow as real pedalboard rows: just a block container */
      display: block;
    }

    /* shared card base */
    .rig-slot {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 8px;
      box-sizing: border-box;
      flex-shrink: 0;
      transition: border-color 0.18s, background 0.18s;
      vertical-align: top;
    }
    .rig-slot:focus-visible { outline: 2px solid #9C54D5; outline-offset: 2px; }

    /* pedal slot — standard × standard */
    .rig-pedal-slot {
      width: 190px;
      height: 160px;
      border: 2px dashed #444;
      background: transparent;
      margin: 0 5px 10px 5px;
    }
    .rig-pedal-slot:hover,
    .rig-pedal-slot.rig-slot--active {
      border-color: #9C54D5;
      background: #1a1a1a;
    }

    /* amp slot — xlarge × standard */
    .rig-amp-slot {
      width: 400px;
      height: 160px;
      border: 2px dashed #444;
      background: #1a1a1a;
      margin: 0 5px 10px 5px;
    }
    .rig-amp-slot:hover,
    .rig-amp-slot.rig-slot--active {
      border-color: #9C54D5;
      background: #222;
    }

    /* row wrapper — same gap as real renderPedalboard */
    .rig-slot-row {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 10px;
      margin-top: -12px; /* matches production row marginTop */
      margin-bottom: 0;
    }
    .rig-slot-row + .rig-slot-row {
      margin-top: 10px;
    }

    /* section label */
    .rig-slot-section-label {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #666;
      text-transform: uppercase;
      margin: 20px 0 8px 5px;
    }
    .rig-slot-section-label:first-child { margin-top: 0; }

    /* divider between pedal and amp sections */
    .rig-slot-divider {
      border: none;
      border-top: 1px solid #2a2a2a;
      margin: 16px 0 0 0;
    }

    /* icon and label inside each slot */
    .rig-slot-icon {
      font-size: 1.4rem;
      font-weight: 300;
      color: #555;
      line-height: 1;
      margin-bottom: 6px;
      transition: color 0.18s;
    }
    .rig-slot:hover .rig-slot-icon,
    .rig-slot.rig-slot--active .rig-slot-icon { color: #9C54D5; }

    .rig-slot-label {
      font-size: 0.78rem;
      color: #666;
      text-align: center;
    }
    .rig-amp-slot .rig-slot-label { color: #888; }
  </style>

    <!--
    ══════════════════════════════════════════════════════════════════════
      TEST PATCH  —  inline only, zero production file changes

      What it does:
        1. Wraps renderPedalboard() so that when the board is empty it
           draws 3 pedal slots + 1 amp slot instead of the plain message.
        2. Tracks which slot the user clicked in window._pendingSlot.
        3. Wraps the nav-rigs.js handleAddPedal machinery by intercepting
           window.pedalboard.pedals.push so the new gear lands in the
           right slot (row + position) and the matching slot card is
           replaced by the real pedal on the next renderPedalboard().
        4. Opening the search bar: triggers #toggleFilterBtn directly
           (which calls fetchAndRenderPedals with the current input value).
           For the amp slot, pre-fills the input with the amp category
           string so only amp-type results appear.
    ══════════════════════════════════════════════════════════════════════
    -->
    <script>
    (function () {

      /* ── constants ─────────────────────────────────────────────────── */
      const AMP_CATEGORY = 'head/amp simulator/combo/preamp/power amp/cab simulator/frfr/ir loader';

      /*
        _pendingSlot: set when the user clicks a slot; cleared on the next
        pedalboard.pedals.push() so the gear goes to the right row/position.
        Shape: { row: Number, isAmp: Boolean } | null
      */
      window._pendingSlot = null;

      /* ── openSearchForSlot ─────────────────────────────────────────── */
      // Triggers the existing nav-rigs.js search bar exactly as if the
      // user had clicked the search icon in the header.
      // For amp slots we pre-fill the input with the amp category so
      // fetchAndRenderPedals() returns only amp-type results.
      function openSearchForSlot(row, isAmp) {
        window._pendingSlot = { row, isAmp };

        // Mark slot as active (visual feedback)
        document.querySelectorAll('.rig-slot').forEach(s => s.classList.remove('rig-slot--active'));
        const activeSlot = document.querySelector(
          isAmp ? '.rig-amp-slot' : `.rig-pedal-slot[data-slot-row="${row}"]`
        );
        if (activeSlot) activeSlot.classList.add('rig-slot--active');

        // Always clear the dropdown so toggleFilterBtn fires a fresh fetch
        const $dropdown = $('#pedalAddDropdownContainer');
        $dropdown.empty().hide();

        // Pre-fill input: amp category or blank
        $('#pedalFilterInput').val(isAmp ? AMP_CATEGORY : '');

        // Trigger the search button — nav-rigs.js does the rest
        $('#toggleFilterBtn').trigger('click');
      }

      /* ── makeSlotCard ──────────────────────────────────────────────── */
      function makeSlotCard(row, isAmp) {
        const el = document.createElement('div');
        el.className = 'rig-slot ' + (isAmp ? 'rig-amp-slot' : 'rig-pedal-slot');
        el.setAttribute('role', 'button');
        el.setAttribute('tabindex', '0');
        if (!isAmp) el.dataset.slotRow = row;
        el.innerHTML = `
          <span class="rig-slot-icon">+</span>
          <span class="rig-slot-label">${isAmp ? 'Add amplifier' : 'Add pedal'}</span>`;
        const open = () => openSearchForSlot(row, isAmp);
        el.addEventListener('click', open);
        el.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
        });
        return el;
      }

      /* ── Intercept pedalboard.pedals.push ──────────────────────────── */
      // nav-rigs.js handleAddPedal always does:
      //   window.pedalboard.pedals.push({ pedal_id, rotation: 0, row: 1 })
      //   then calls renderPedalboard()
      //
      // We intercept that push to override row with the pending slot's row.
      // We use a Proxy on the pedals array once pedalboard is initialised.
      function patchPedalsPush(pedalsArray) {
        const originalPush = pedalsArray.push.bind(pedalsArray);
        pedalsArray.push = function (...items) {
          if (window._pendingSlot) {
            items = items.map(item => ({
              ...item,
              row: window._pendingSlot.row
            }));
            window._pendingSlot = null;
            // Remove active state from slots
            document.querySelectorAll('.rig-slot--active')
              .forEach(s => s.classList.remove('rig-slot--active'));
          }
          return originalPush(...items);
        };
      }

      // pedalboard.pedals is set by rigs.js after init; poll until it's ready
      const _patchPoll = setInterval(() => {
        if (!window.pedalboard?.pedals) return;
        clearInterval(_patchPoll);
        patchPedalsPush(window.pedalboard.pedals);

        // Re-patch every time pedalboard changes (rig switch)
        Object.defineProperty(window, 'pedalboard', {
          get() { return this._pedalboard; },
          set(v) {
            this._pedalboard = v;
            if (v?.pedals) patchPedalsPush(v.pedals);
          },
          configurable: true
        });
      }, 100);

      /* ── Override renderPedalboard ─────────────────────────────────── */
      const _renderPoll = setInterval(() => {
        if (typeof window.renderPedalboard !== 'function') return;
        clearInterval(_renderPoll);

        const _orig = window.renderPedalboard;

        window.renderPedalboard = function () {
          const pedals = window.pedalboard?.pedals || [];

          if (pedals.length > 0) {
            // Real pedals exist: let original render them, then append
            // a trailing "+ Add pedal" slot on each row.
            _orig();
            const container = document.getElementById('pedalboard');
            if (!container) return;

            // Find rows (direct flex children created by _orig)
            const maxRow = Math.max(...pedals.map(p => p.row || 1));
            // append an inline add-slot after each row's last child
            Array.from(container.children).forEach((rowDiv, idx) => {
              if (rowDiv.style?.display === 'flex' && !rowDiv.querySelector('.rig-slot')) {
                rowDiv.style.alignItems = 'center';
                const slot = makeSlotCard(idx + 1, false);
                slot.style.marginLeft = '4px';
                rowDiv.appendChild(slot);
              }
            });

            // Always show the amp slot below
            container.querySelector('.rig-amp-row-wrapper')?.remove();
            const wrapper = document.createElement('div');
            wrapper.className = 'rig-amp-row-wrapper';
            wrapper.style.cssText = 'margin-top:20px; padding-top:16px; border-top:1px solid #2a2a2a;';
            wrapper.appendChild(makeSlotCard(99, true));
            container.appendChild(wrapper);
            return;
          }

          /* ── Empty board ─────────────────────────────────────────── */
          const container = document.getElementById('pedalboard');
          if (!container) return;
          container.innerHTML = '';

          const state = document.createElement('div');
          state.className = 'rig-empty-state';

          // Section label — pedals
          const labelPedals = document.createElement('p');
          labelPedals.className = 'rig-slot-section-label';
          labelPedals.textContent = 'Pedalboard · Signal Chain';
          state.appendChild(labelPedals);

          // Row 1 — 3 pedal slots
          const pedalRow = document.createElement('div');
          pedalRow.className = 'rig-slot-row';
          pedalRow.style.marginTop = '0';
          for (let i = 1; i <= 3; i++) {
            pedalRow.appendChild(makeSlotCard(i, false));
          }
          state.appendChild(pedalRow);

          // Divider
          const hr = document.createElement('hr');
          hr.className = 'rig-slot-divider';
          state.appendChild(hr);

          // Section label — amp
          const labelAmp = document.createElement('p');
          labelAmp.className = 'rig-slot-section-label';
          labelAmp.textContent = 'Amplifier';
          state.appendChild(labelAmp);

          // Row 2 — 1 amp slot
          const ampRow = document.createElement('div');
          ampRow.className = 'rig-slot-row';
          ampRow.style.marginTop = '0';
          ampRow.appendChild(makeSlotCard(99, true));
          state.appendChild(ampRow);

          container.appendChild(state);
        };

      }, 50);

    })();
    </script>

  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const pending = JSON.parse(localStorage.getItem('pendingPedalAdd'));
    if (!pending) return;
    localStorage.removeItem('pendingPedalAdd');
    if (window.pedalboard?.pedals) {
      window.pedalboard.pedals.push(pending);
      renderPedalboard();
    }
  });
  </script>

  <script>
  $(document).ready(function () {
    if (window.location.protocol === 'file:') {
      alert('Please run via a local HTTP server.');
      $('#page-content').hide();
      return;
    }

    const token = localStorage.getItem('authToken');

    if (!token) {
      $('#page-content').show();
      $('#pedalboard-controls').prepend('<p>Login to consistently save your Rigs!</p>');
      $('#pedalboardSelect, #renameBoardBtn').hide();
      $('#zoomIn, #zoomOut, #zoomReset').prop('disabled', true).addClass('btn-disabled');
      window.currentUser = { role: 'guest', username: 'guest' };
      if (typeof initNavPedalboard === 'function') initNavPedalboard('guest');
      if (typeof initPedalboard    === 'function') initPedalboard('guest');
      return;
    }

    $.ajax({
      url: 'https://api.pedalplex.com/USER_CHECK_AUTH_JWT.php',
      method: 'GET', dataType: 'json',
      headers: { 'Authorization': 'Bearer ' + token },
      success: function (user) {
        $('#page-content').show();
        window.currentUser = user;
        if (typeof initNavPedalboard === 'function') initNavPedalboard(user.role);
        if (typeof initPedalboard    === 'function') initPedalboard(user.role);
      },
      error: function (xhr) {
        if (xhr.status === 401) {
          localStorage.removeItem('authToken');
          window.currentUser = { role: 'guest', username: 'guest' };
          $('#page-content').show();
          $('#pedalboardSelect, #renameBoardBtn').hide();
          if (typeof initNavPedalboard === 'function') initNavPedalboard('guest');
          if (typeof initPedalboard    === 'function') initPedalboard('guest');
        } else {
          alert('Auth check failed.');
        }
      }
    });
  });
  </script>
