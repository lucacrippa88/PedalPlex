      align-items: center;
      justify-content: center;
      border: 2px dashed #444;
      border-radius: 8px;
      cursor: pointer;
      box-sizing: border-box;
      transition: border-color 0.15s, background 0.15s;
      flex-shrink: 0;
    }
    .empty-slot:hover,
    .empty-slot:focus-visible {
      border-color: #9C54D5;
      background: #1a1a1a;
      outline: none;
    }

    /* pedal slot: standard × standard */
    .empty-slot--pedal {
      width: 190px;
      height: 160px;
    }

    /* amp slot: xlarge × standard */
    .empty-slot--amp {
      width: 400px;
      height: 160px;
    }

    .empty-slot__plus {
      font-size: 2rem;
      font-weight: 200;
      color: #555;
      line-height: 1;
      transition: color 0.15s;
    }
    .empty-slot:hover .empty-slot__plus,
    .empty-slot:focus-visible .empty-slot__plus {

    }

    .empty-slot__label {

    /* row wrapper identical to renderPedalboard rows */

      gap: 10px;
      align-items: center;
      margin-top: -12px;

    /* inline + slot appended to populated rows */
    .empty-slot--inline {

      height: 100px;
      border-width: 1px;
      align-self: center;
    }

  <!--
  ════════════════════════════════════════════════════════════════════
   TEST PATCH — zero changes to production files.

   Logic:
     • window._nextRow: 1 = pedal, 2 = amp.
       Set when the user clicks a slot; consumed by the patched .push()
       so the gear lands on the correct row.

     • openSearch(row): records the target row, clears the dropdown
       cache, and triggers #toggleFilterBtn — which is the exact same
       call path as clicking the search icon in the header.
       For row 2 (amp) the input is pre-filled with amp categories.

     • patchPush(): wraps window.pedalboard.pedals.push so the next
       item gets row = window._nextRow instead of the default 1.

     • renderPedalboard override:
         - empty board  → 1 pedal slot (row 1) + 1 amp slot (row 2)
         - populated    → original render + inline + slot per row
                          + amp slot always at the bottom
  ════════════════════════════════════════════════════════════════════
  -->
  <script>
  (function () {

    const AMP_CATS = 'head/amp simulator/combo/preamp/power amp/cab simulator/frfr/ir loader';

    /* next row to use when the user picks a gear — default 1 */
    window._nextRow = 1;

    /* ── openSearch(row) ───────────────────────────────────────────
       Triggers the exact same search flow as clicking the header
       search icon (addGearsTrigger → toggleFilterBtn).
       For row 2 pre-fills the input with amp categories.
    ─────────────────────────────────────────────────────────────── */
    function openSearch(row) {
      window._nextRow = row;

      const $input = $('#pedalFilterInput');

      /* pre-fill: amp categories for row 2, blank for pedals */
      $input.val(row === 2 ? AMP_CATS : '');

      /* show + focus the input, identical to what toggleFilterBtn handler does */
      $input.show().focus();

      /* clear dropdown cache so a fresh fetch always fires */
      const dd = document.getElementById('pedalAddDropdownContainer');
      if (dd) { dd.innerHTML = ''; dd.style.display = 'none'; }

      /* trigger the input event — nav-rigs.js debounce picks it up and opens the dropdown */
      $input.trigger('input');
    }

    /* ── makeSlot(row, isAmp) ──────────────────────────────────────
       Returns a slot <div> wired to openSearch(row).
    ─────────────────────────────────────────────────────────────── */
    function makeSlot(row, isAmp) {
      const el = document.createElement('div');
      el.className = 'empty-slot ' + (isAmp ? 'empty-slot--amp' : 'empty-slot--pedal');
      el.setAttribute('role', 'button');
      el.setAttribute('tabindex', '0');
      el.innerHTML =
        '<span class="empty-slot__plus">+</span>' +
        '<span class="empty-slot__label">' + (isAmp ? 'Add amplifier' : 'Add pedal') + '</span>';
      el.addEventListener('click', () => openSearch(row));
      el.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openSearch(row); }
      });
      return el;
    }

    /* ── patchPush() ───────────────────────────────────────────────
       Wraps pedals.push so the next gear gets row = window._nextRow.
       nav-rigs.js handleAddPedal does:
         window.pedalboard.pedals.push({ pedal_id, rotation:0, row:1 })
       We override row here.
    ─────────────────────────────────────────────────────────────── */
    function patchPush(arr) {
      if (arr.__patched) return;
      arr.__patched = true;
      const orig = arr.push.bind(arr);
      arr.push = function (...items) {
        return orig(...items.map(item =>
          (item && item.pedal_id) ? { ...item, row: window._nextRow } : item
        ));
      };
    }

    /* poll until rigs.js has created window.pedalboard */
    const _pp = setInterval(() => {
      if (!window.pedalboard?.pedals) return;
      clearInterval(_pp);
      patchPush(window.pedalboard.pedals);
    }, 80);

    /* ── override renderPedalboard ─────────────────────────────────
       Poll until rigs.js has defined it, then wrap it.
    ─────────────────────────────────────────────────────────────── */
    const _rp = setInterval(() => {
      if (typeof window.renderPedalboard !== 'function') return;
      clearInterval(_rp);

      const _orig = window.renderPedalboard;

      window.renderPedalboard = function () {
        const pedals = window.pedalboard?.pedals ?? [];

        /* ── empty board ─────────────────────────────────────────── */
        if (pedals.length === 0) {
          const container = document.getElementById('pedalboard');
          if (!container) return;
          container.innerHTML = '';

          /* row 1 — pedal slot */
          const r1 = document.createElement('div');
          r1.className = 'empty-slot-row';
          r1.appendChild(makeSlot(1, false));
          container.appendChild(r1);

          /* small gap between rows */
          const gap = document.createElement('div');
          gap.style.height = '16px';
          container.appendChild(gap);

          /* row 2 — amp slot */
          const r2 = document.createElement('div');
          r2.className = 'empty-slot-row';
          r2.appendChild(makeSlot(2, true));
          container.appendChild(r2);

          return;
        }

        /* ── populated board ─────────────────────────────────────── */
        _orig(); /* let production code draw all real pedals */

        const container = document.getElementById('pedalboard');
        if (!container) return;

        /* patch newly created pedal arrays after an add */
        if (window.pedalboard?.pedals) patchPush(window.pedalboard.pedals);

        /* append inline + slot at the end of each pedal row */
        Array.from(container.children).forEach((rowDiv, i) => {
          if (rowDiv.style?.display !== 'flex') return;
          if (rowDiv.querySelector('.empty-slot')) return; /* already added */
          rowDiv.style.alignItems = 'center';
          const s = makeSlot(i + 1, false);
          s.classList.add('empty-slot--inline');
          rowDiv.appendChild(s);
        });

        /* amp slot fixed at the bottom */
        container.querySelector('.js-amp-footer')?.remove();
        const footer = document.createElement('div');
        footer.className = 'js-amp-footer';
        footer.style.cssText = 'margin-top:20px; padding-top:16px; border-top:1px solid #2a2a2a;';
        footer.appendChild(makeSlot(2, true));
        container.appendChild(footer);
      };

    }, 50);

  })();
  </script>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const pending = JSON.parse(localStorage.getItem('pendingPedalAdd'));
  if (!pending) return;
  localStorage.removeItem('pendingPedalAdd');
  if (window.pedalboard?.pedals) {
    window.pedalboard.pedals.push(pending);
    renderPedalboard();
  }
});
</script>

<script>
$(document).ready(function () {
  if (window.location.protocol === 'file:') {
    alert('Please run via a local HTTP server.');
    $('#page-content').hide();
    return;
  }

  const token = localStorage.getItem('authToken');

  if (!token) {
    $('#page-content').show();
    $('#pedalboard-controls').prepend('<p>Login to consistently save your Rigs!</p>');
    $('#pedalboardSelect, #renameBoardBtn').hide();
    $('#zoomIn, #zoomOut, #zoomReset').prop('disabled', true).addClass('btn-disabled');
    window.currentUser = { role: 'guest', username: 'guest' };
    if (typeof initNavPedalboard === 'function') initNavPedalboard('guest');
    if (typeof initPedalboard    === 'function') initPedalboard('guest');
    return;
  }

  $.ajax({
    url: 'https://api.pedalplex.com/USER_CHECK_AUTH_JWT.php',
    method: 'GET', dataType: 'json',
    headers: { 'Authorization': 'Bearer ' + token },
    success: function (user) {
      $('#page-content').show();
      window.currentUser = user;
      if (typeof initNavPedalboard === 'function') initNavPedalboard(user.role);
      if (typeof initPedalboard    === 'function') initPedalboard(user.role);
    },
    error: function (xhr) {
      if (xhr.status === 401) {
        localStorage.removeItem('authToken');
        window.currentUser = { role: 'guest', username: 'guest' };
        $('#page-content').show();
        $('#pedalboardSelect, #renameBoardBtn').hide();
        if (typeof initNavPedalboard === 'function') initNavPedalboard('guest');
        if (typeof initPedalboard    === 'function') initPedalboard('guest');
      } else {
        alert('Auth check failed.');
      }
    }
  });
});
</script>
