  <style>
    .pedal-catalog {
      outline: 2px dashed #666;   /* dashed border around the pedal */
      outline-offset: 2px;        /* space between pedal and dashed line */
      position: relative;
    }
    /* dashed overlay */
    .pedal-catalog::after {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image: 
        repeating-linear-gradient(
          45deg,
          transparent,
          transparent 4px,
          rgba(0,0,0,0.2) 4px,
          rgba(0,0,0,0.2) 8px
        );
      z-index: 10;
      pointer-events: auto; /* overlay receives events */
    }

    /* Make overlay ignore clicks for the pedal div itself, but block children */
    .pedal-catalog > * {
      pointer-events: none; /* children cannot receive pointer events */
    }

    #pedalboard-controls {
      display: flex !important;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    /* Drag and drop style */
    .dnd-placeholder {
      box-sizing: border-box;
      border: 2px dashed rgba(0,0,0,0.2);
      border-radius: 6px;
      margin: 0 6px;
      background: rgba(0,0,0,0.02);
      flex: 0 0 auto;
    }
    .dnd-ghost {
      position: fixed;
      pointer-events: none;
      z-index: 99999;
      transform: translate(-50%, -50%);
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      opacity: 0.95;
    }
    .pedal-wrapper,
    .pedal-catalog {
      transition: transform 180ms ease, box-shadow 120ms ease;
      will-change: transform;
    }
    .pedal-wrapper.dnd-dragging,
    .pedal-catalog.dnd-dragging {
      opacity: 0.85;
      box-shadow: 0 12px 30px rgba(0,0,0,0.45);
      transform-origin: center center;
    }

    .pedalboard-dnd-placeholder {
      box-sizing: border-box;
      border: 3px dashed rgba(50,50,200,0.7);
      border-radius: 8px;
      background: rgba(50,50,200,0.1);
      margin: 0 8px;
      flex: 0 0 auto;
      transition: height 100ms ease, width 100ms ease;
    }



  </style>

    <script>
    (function () {
      // Dimensioni da helpers.js: standard=190x160, xlarge=400x160
      var PEDAL_W = 190, PEDAL_H = 160;
      var AMP_W   = 400, AMP_H   = 160;

      var AMP_CATEGORIES = ['amp simulator','cab simulator','combo','frfr','head','ir loader','power amp','preamp'];
      var _activeSlot = null;

      window.deactivateSlot = function deactivateSlot() {
        if (_activeSlot) {
          _activeSlot.style.borderColor = '#555';
          _activeSlot.style.borderStyle = 'dashed';
          _activeSlot.style.color = '#666';
          _activeSlot.style.background = '';
          _activeSlot = null;
        }
      }

      function activateSlot(el) {
        deactivateSlot();
        _activeSlot = el;
        el.style.borderColor = '#6929c4';
        el.style.borderStyle = 'solid';
        el.style.color = '#a78bdc';
        el.style.background = 'rgba(105,41,196,0.08)';
      }

      // Deattiva lo slot quando il dropdown viene chiuso dall'esterno
      // (skippa il click corrente che ha appena aperto lo slot)
      var _skipNextDeactivate = false;
      document.addEventListener('click', function () {
        if (_skipNextDeactivate) { _skipNextDeactivate = false; return; }
        deactivateSlot();
      });

      function openSearch(row, insertAt, slotEl) {
        _skipNextDeactivate = true;
        activateSlot(slotEl);
        window._emptySlotRow = row;
        window._emptySlotInsertAt = (insertAt !== undefined) ? insertAt : null;
        window._emptySlotCategory = (row === 2) ? AMP_CATEGORIES : null;
        // Svuota il dropdown così toggleFilterBtn chiama sempre fetchAndRenderPedals
        var dd = document.getElementById('pedalAddDropdownContainer');
        if (dd) { dd.innerHTML = ''; dd.style.display = 'none'; }
        $("#toggleFilterBtn").trigger("click");
      }

      function makeSlot(w, h, row, insertAt) {
        var el = document.createElement('div');
        el.style.cssText = [
          'width:'  + w + 'px',
          'height:' + h + 'px',
          'border: 2px dashed #555',
          'border-radius: 8px',
          'display: flex',
          'flex-direction: column',
          'align-items: center',
          'justify-content: center',
          'cursor: pointer',
          'gap: 8px',
          'color: #666',
          'font-size: 0.8rem',
          'flex-shrink: 0',
          'transition: border-color 0.15s, color 0.15s, background 0.15s'
        ].join(';');
        el.innerHTML = '<span style="font-size:1.5rem;line-height:1;font-weight:300;pointer-events:none">+</span>';
        el.addEventListener('mouseenter', function () {
          if (el === _activeSlot) return;
          el.style.borderColor = '#888';
          el.style.color = '#bbb';
          el.style.background = 'rgba(255,255,255,0.04)';
        });
        el.addEventListener('mouseleave', function () {
          if (el === _activeSlot) return;
          el.style.borderColor = '#555';
          el.style.color = '#666';
          el.style.background = '';
        });
        el.addEventListener('click', function (e) {
          e.stopPropagation();
          openSearch(row, insertAt, el);
        });
        return el;
      }

      // Monkey-patch renderPedalboard: dopo il render originale, appende gli slot vuoti
      var _orig = window.renderPedalboard;
      window.renderPedalboard = function () {
        // Chiama sempre il render originale
        if (typeof _orig === 'function') _orig();

        var container = document.getElementById('pedalboard');
        if (!container) return;

        var pedals = (window.pedalboard && Array.isArray(window.pedalboard.pedals))
                     ? window.pedalboard.pedals : [];

        // Calcola per ogni row: primo indice globale e conteggio
        // rowIndex[r] = primo indice in pedals[] dove compare la row r
        var rowFirstIdx = {};
        var rowCount = {};
        pedals.forEach(function(p, i) {
          var r = p.row || 1;
          if (rowFirstIdx[r] === undefined) rowFirstIdx[r] = i;
          rowCount[r] = (rowCount[r] || 0) + 1;
        });
        // insertAt per lo slot in coda alla row r = rowFirstIdx[r] + rowCount[r]
        // (equivale all'indice del primo elemento della row successiva, o pedals.length)
        function slotInsertAt(r) {
          if (rowFirstIdx[r] === undefined) return pedals.length; // row vuota: in coda
          return rowFirstIdx[r] + (rowCount[r] || 0);
        }

        if (pedals.length === 0) {
          // Empty state: riga pedali (row 1) + riga amp (row 2)
          container.innerHTML = '';

          // -- Sezione pedalboard --
          var boardLabel = document.createElement('p');
          boardLabel.textContent = 'PEDALBOARD · SIGNAL CHAIN';
          boardLabel.style.cssText = 'font-size:0.7rem;letter-spacing:0.08em;color:#666;margin:0 0 10px 0;';
          container.appendChild(boardLabel);

          var row1 = document.createElement('div');
          row1.id = 'emptyRow1';
          row1.style.cssText = 'display:flex;gap:12px;flex-wrap:wrap;margin-bottom:32px;';
          row1.appendChild(makeSlot(PEDAL_W, PEDAL_H, 1, 0));
          row1.appendChild(makeSlot(PEDAL_W, PEDAL_H, 1, 1));
          row1.appendChild(makeSlot(PEDAL_W, PEDAL_H, 1, 2));
          container.appendChild(row1);

          // -- Sezione amp --
          var ampLabel = document.createElement('p');
          ampLabel.textContent = 'AMPLIFIER';
          ampLabel.style.cssText = 'font-size:0.7rem;letter-spacing:0.08em;color:#666;margin:0 0 10px 0;';
          container.appendChild(ampLabel);

          var row2 = document.createElement('div');
          row2.id = 'emptyRow2';
          row2.style.cssText = 'display:flex;flex-direction:column;gap:12px;';
          row2.appendChild(makeSlot(AMP_W, AMP_H, 2, 0));
          container.appendChild(row2);

        } else {
          // Rig popolato: le righe esistenti sono i div figli di container (generati dall'originale)
          var existingRowDivs = Array.prototype.slice.call(
            container.querySelectorAll(':scope > div')
          );

          var rowNums = Object.keys(rowFirstIdx).map(Number).sort(function(a,b){return a-b;});

          // Svuota e ricostruisce con sezioni etichettate
          container.innerHTML = '';

          // ── Sezione PEDALBOARD (row 1) ──────────────────────────────
          var hasRow1 = rowFirstIdx[1] !== undefined;
          var boardLabel = document.createElement('p');
          boardLabel.textContent = 'PEDALBOARD · SIGNAL CHAIN';
          boardLabel.style.cssText = 'font-size:0.7rem;letter-spacing:0.08em;color:#666;margin:0 0 10px 0;';
          container.appendChild(boardLabel);

          var row1Div;
          if (hasRow1) {
            row1Div = existingRowDivs[rowNums.indexOf(1)];
            row1Div.style.flexWrap = 'wrap';
            row1Div.style.gap = '12px';
          } else {
            row1Div = document.createElement('div');
            row1Div.style.cssText = 'display:flex;gap:12px;flex-wrap:wrap;';
          }
          row1Div.appendChild(makeSlot(PEDAL_W, PEDAL_H, 1, slotInsertAt(1)));
          row1Div.style.marginBottom = '32px';
          container.appendChild(row1Div);

          // ── Sezione AMPLIFIER (row 2) ───────────────────────────────
          var hasRow2 = rowFirstIdx[2] !== undefined;
          var ampLabel = document.createElement('p');
          ampLabel.textContent = 'AMPLIFIER';
          ampLabel.style.cssText = 'font-size:0.7rem;letter-spacing:0.08em;color:#666;margin:0 0 10px 0;';
          container.appendChild(ampLabel);

          var row2Div;
          if (hasRow2) {
            row2Div = existingRowDivs[rowNums.indexOf(2)];
            row2Div.style.flexDirection = 'column';
            row2Div.style.gap = '12px';
          } else {
            row2Div = document.createElement('div');
            row2Div.style.cssText = 'display:flex;flex-direction:column;gap:12px;';
          }
          row2Div.appendChild(makeSlot(AMP_W, AMP_H, 2, slotInsertAt(2)));
          container.appendChild(row2Div);
        }
      };

    })();
    </script>

  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const pending = JSON.parse(localStorage.getItem('pendingPedalAdd'));
    if (!pending) return;

    localStorage.removeItem('pendingPedalAdd');

    if (window.pedalboard && window.pedalboard.pedals) {
      window.pedalboard.pedals.push(pending);
      renderPedalboard();
    }
  });
  </script>

  <script>
  // ── Handle shared plex import (redirected from plexes-share.js) ──────────────
  (function () {
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('import_shared_plex') !== '1') return;

    const raw = sessionStorage.getItem('pp_import_shared_plex');
    if (!raw) return;

    let importPayload;
    try { importPayload = JSON.parse(raw); } catch (e) { return; }
    if (importPayload.source !== 'shared_plex_import') return;

    // Clean up immediately so a refresh doesn't re-trigger
    sessionStorage.removeItem('pp_import_shared_plex');
    // Also clean the query param without reloading
    history.replaceState(null, '', window.location.pathname);

    const { plex, plex_name: plexName, board: sourceBoard } = importPayload;

    // rigs.js calls onPedalboardLoaded() once the board is rendered.
    // Hook into it to trigger the import dialog after the page is ready.
    var _prevOnPedalboardLoaded = window.onPedalboardLoaded;
    window.onPedalboardLoaded = function () {
      if (typeof _prevOnPedalboardLoaded === 'function') _prevOnPedalboardLoaded();
      var token = localStorage.getItem('authToken');
      if (!token) return; // guest users can't use this flow
      window.onPedalboardLoaded = _prevOnPedalboardLoaded || undefined; // restore
      _createRigAndPlex(plex, plexName, sourceBoard, token);
    };
  })();

  async function _createRigAndPlex(plex, plexName, sourceBoard, token) {
    window._importSharedPlexDone = true;

    const defaultRigName = (sourceBoard && sourceBoard.board_name ? sourceBoard.board_name : 'Imported Rig').substring(0, 100);

    const { value: rigName } = await Swal.fire({
      title: 'Name your new Rig',
      html: `
        <p style="text-align:left;margin-bottom:1rem;">A new Rig will be created with the pedals from the shared ${L.Plex}.</p>
        <label class="bx--label" style="display:block;text-align:left;margin-bottom:4px;">Rig name</label>
        <input id="importRigName" class="bx--text-input" value="${defaultRigName.replace(/"/g, '&quot;')}" maxlength="100" style="width:100%;">`,
      showCancelButton: true,
      confirmButtonText: 'Create Rig & Import',
      cancelButtonText: 'Cancel',
      customClass: { confirmButton: 'bx--btn bx--btn--primary', cancelButton: 'bx--btn bx--btn--secondary' },
      preConfirm: () => {
        const name = document.getElementById('importRigName') ? document.getElementById('importRigName').value.trim() : '';
        if (!name) { Swal.showValidationMessage('Please enter a Rig name.'); return false; }
        return name;
      },
      didOpen: () => {
        const el = document.getElementById('importRigName');
        if (el) el.select();
      }
    });

    if (!rigName) return; // cancelled

    // 1. Create the Rig
    let newRigId;
    try {
      const authPayload = JSON.parse(atob(token.split('.')[1]));
      const userId = 'user_' + (authPayload.username || authPayload.sub || '');
      const boardPedals = Array.isArray(sourceBoard && sourceBoard.pedals) ? sourceBoard.pedals : [];
      const rigRes = await fetch('https://api.pedalplex.com/CREATE_RIG.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Authorization': 'Bearer ' + token },
        body: new URLSearchParams({ board_name: rigName, user_id: userId, pedals: JSON.stringify(boardPedals) })
      });
      const rigData = await rigRes.json();
      if (!rigData.ok) throw new Error(rigData.error || 'Failed to create Rig');
      newRigId = rigData.id;
    } catch (e) {
      Swal.fire({ icon: 'error', title: 'Could not create Rig', text: e.message, showConfirmButton: false, timer: 2500 });
      return;
    }

    // 2. Create the Plex on the new Rig
    try {
      const plexRes = await fetch('https://api.pedalplex.com/CREATE_PLEX.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({
          board_id:    newRigId,
          board_name:  rigName,
          preset_name: plexName,
          pedals:      plex.pedals || {}
        })
      });
      const plexData = await plexRes.json();
      if (!plexData.ok) throw new Error(plexData.error || ('Failed to create ' + L.Plex));
    } catch (e) {
      Swal.fire({ icon: 'error', title: 'Rig created, but ' + L.Plex + ' import failed', text: e.message, showConfirmButton: false, timer: 2500 });
      return;
    }

    Swal.fire({
      icon: 'success',
      title: 'Rig & ' + L.Plex + ' imported!',
      html: '<strong>' + rigName + '</strong> has been created with the ' + L.Plex + ' <strong>' + plexName + '</strong>.',
      confirmButtonText: 'Go to ' + L.Plexes,
      showCancelButton: true,
      cancelButtonText: 'Stay here',
      customClass: { confirmButton: 'bx--btn bx--btn--primary', cancelButton: 'bx--btn bx--btn--secondary' }
    }).then(function (r) {
      if (r.isConfirmed) {
        window.location.href = '/plexes';
      } else {
        window.location.reload();
      }
    });
  }
  </script>




  <script>
  $(document).ready(function() {
    if (window.location.protocol === 'file:') {
      alert('Please run this app via a local HTTP server for full functionality.');
      $('#loadingMessage, #page-content').hide();
      return;
    }

    const token = localStorage.getItem('authToken');

    if (!token) {
      // Guest mode
      $('#loadingMessage').hide();
      $('#page-content').show();
      $('#pedalboard-controls').prepend('<p>Login to consistently save your Rigs!</p>');
      $('#pedalboardSelect, #renameBoardBtn').hide();
      $('#zoomIn, #zoomOut, #zoomReset').prop('disabled', true).addClass('btn-disabled');
      window.currentUser = { role: 'guest', username: 'guest' };

      if (typeof initNavPedalboard === 'function') initNavPedalboard('guest');
      if (typeof initPedalboard === 'function') initPedalboard('guest');
      return;
    }

    // Attempt server auth
    $.ajax({
      url: 'https://api.pedalplex.com/USER_CHECK_AUTH_JWT.php',
      method: 'GET',
      dataType: 'json',
      headers: { 'Authorization': 'Bearer ' + token },
      success: function(userFromServer) {
        $('#loadingMessage').hide();
        $('#page-content').show();
        window.currentUser = userFromServer;

        // Recupera eventuali pedalboard guest
        const guestBoardsRaw = localStorage.getItem("guestPedalboard");
        let guestBoards = [];
        if (guestBoardsRaw) {
          try {
            guestBoards = JSON.parse(guestBoardsRaw);
          } catch(e) {
            console.error("Errore parsing guestPedalboard:", e);
            localStorage.removeItem("guestPedalboard");
          }
        }

        if (guestBoards.length > 0) {
          // Prompt per import
          Swal.fire({
            title: "Import last saved Guest Rig?",
            text: "We found a Rig you created as a guest. Do you want to import it into your account?",
            icon: "question",
            showCancelButton: true,
            confirmButtonText: "Yes, import",
            cancelButtonText: "No, discard",
            allowOutsideClick: false,
            allowEscapeKey: false,
            customClass: {
              confirmButton: "bx--btn bx--btn--primary",
              cancelButton: "bx--btn bx--btn--secondary"
            }
          }).then((result) => {
            if (result.isConfirmed) {
              const promises = guestBoards.map(b => importGuestPedalboard(b, userFromServer.id));
              Promise.all(promises)
                .then(() => {
                  localStorage.removeItem("guestPedalboard");
                  Swal.fire({
                    title: "Imported!",
                    text: "Your guest Rig is now in your account.",
                    icon: "success",
                    confirmButtonText: "Ok",
                    showCancelButton: false,
                    customClass: { confirmButton: "bx--btn bx--btn--primary" }
                  }).finally(() => {
                    if (typeof initNavPedalboard === 'function') initNavPedalboard(userFromServer.role);
                    if (typeof initPedalboard === 'function') initPedalboard(userFromServer.role);
                  });
                })
                .catch(err => {
                  console.error(err);
                  Swal.fire("Error", "Guest pedalboard could not be imported.", "error")
                    .finally(() => {
                      if (typeof initNavPedalboard === 'function') initNavPedalboard(userFromServer.role);
                      if (typeof initPedalboard === 'function') initPedalboard(userFromServer.role);
                    });
                });
            } else {
              localStorage.removeItem("guestPedalboard");
              if (typeof initNavPedalboard === 'function') initNavPedalboard(userFromServer.role);
              if (typeof initPedalboard === 'function') initPedalboard(userFromServer.role);
            }
          });
        } else {
          if (typeof initNavPedalboard === 'function') initNavPedalboard(userFromServer.role);
          if (typeof initPedalboard === 'function') initPedalboard(userFromServer.role);
        }
      },

      // ---------- TOKEN EXPIRED (401) ----------
      error: function(xhr) {
        console.error('Auth check failed:', xhr.status, xhr.responseText);

        if (xhr.status === 401) {
          localStorage.removeItem('authToken');

          Swal.fire({
            title: 'Session expired',
            text: 'Your session is expired. Do you want to Login again or continue as a Guest?',
            icon: 'warning',
            showDenyButton: true,
            confirmButtonText: 'Login',
            denyButtonText: 'Be our Guest',
            customClass: {
              confirmButton: 'bx--btn bx--btn--primary',
              denyButton: 'bx--btn bx--btn--tertiary'
            },
            allowOutsideClick: false,
            allowEscapeKey: false
          }).then((result) => {
            if (result.isConfirmed) {
              window.location.href = 'login';
            } else if (result.isDenied) {

              // Guest mode fallback
              window.currentUser = { role: 'guest', username: 'guest' };
              $('#loadingMessage').hide();
              $('#page-content').show();
              $('#pedalboard-controls').append("<p>Login to consistently save your Rigs!</p>");
              $('#pedalboardSelect, #renameBoardBtn').hide();
              $('#zoomIn, #zoomOut, #zoomReset').prop('disabled', true).addClass('btn-disabled');

              if (typeof initNavPedalboard === 'function') initNavPedalboard('guest');
              if (typeof initPedalboard === 'function') initPedalboard('guest');
            }
          });

        } else {
          alert('Failed to verify authentication. Please try again.');
        }
      }
    });
  });
  </script>
